# Сканирование проекта: агент сбора знаний и анализ кода tldr в одном образе.
#
# Подготовка: скопировать .env.example в .env и указать PROJECT_DIR — путь к анализируемому проекту.
# Получение:  docker compose pull        (готовый образ из реестра)
# Сборка:     docker compose build       (локальная сборка вместо готового образа)
# Запуск:     docker compose run --rm scanner --code -- --exclude 'vendor/'

services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TLDR_VERSION: ${TLDR_VERSION:-0.4.0}
        # Неизменяемый идентификатор сборки: тег переставляется, ревизия остаётся.
        IMAGE_REVISION: ${IMAGE_REVISION:-неизвестна}
    image: ${IMAGE:-ghcr.io/united-software-platform/project-snapshot}:${IMAGE_TAG:-latest}
    # Файлы результата принадлежат хозяину каталога, а не root внутри контейнера.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Анализируемый проект монтируется только на чтение: агент ничего в нём не меняет.
      - ${PROJECT_DIR:?укажите PROJECT_DIR в .env}:/project:ro
      - ${OUT_DIR:-./out}:/out
    environment:
      SCAN_PROJECT: /project
      SCAN_OUT: /out
      # Координата образа и его digest: изнутри контейнера они недоступны,
      # поэтому провенанс прогона получает их отсюда.
      SCAN_IMAGE: ${IMAGE:-ghcr.io/united-software-platform/project-snapshot}
      SCAN_IMAGE_TAG: ${IMAGE_TAG:-latest}
      SCAN_IMAGE_DIGEST: ${IMAGE_DIGEST:-неизвестен}
      # Ключ нужен только для извлечения требований; без него агент собирает остальное.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
