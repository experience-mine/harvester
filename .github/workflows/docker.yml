# Сборка образа слепка проекта: приёмочные проверки, сборка, дымовой прогон и публикация в GHCR.
name: docker

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  acceptance:
    name: приёмочные проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Шаг 1 — ядро, схема и командный интерфейс
        run: python tests/step1_acceptance.py

      - name: Шаг 2 — история изменений и рабочая копия
        run: python tests/step2_acceptance.py

      - name: Шаг 3 — посекционный формат, манифест и анализ кода
        run: python tests/step3_acceptance.py

  image:
    name: образ слепка
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      # Запись в contents нужна для отметки версии тегом в репозитории.
      contents: write
      packages: write
    steps:
      # Полная история нужна дымовому прогону: агент собирает коммиты этого же репозитория.
      # Теги нужны вычислению следующей версии.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Версия образа
        id: version
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, subprocess, tomllib

          # Мажор и минор задаёт проект, патч наращивается автоматически от уже выпущенных тегов.
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          major, minor, _ = project.split(".")

          reference = os.environ.get("GITHUB_REF", "")
          if reference.startswith("refs/tags/v"):
              # Версия задана тегом вручную — она и берётся, ничего не наращиваем.
              version = reference[len("refs/tags/v"):]
              bump = "no"
          else:
              tags = subprocess.run(
                  ["git", "tag", "--list", f"v{major}.{minor}.*"],
                  capture_output=True, text=True, check=False,
              ).stdout.split()
              patches = [
                  int(match.group(1))
                  for tag in tags
                  if (match := re.fullmatch(rf"v{major}\.{minor}\.(\d+)", tag))
              ]
              version = f"{major}.{minor}.{max(patches) + 1 if patches else 0}"
              bump = "yes"

          series = ".".join(version.split(".")[:2])
          print(f"version={version}")
          print(f"tag=v{version}")
          print(f"series={series}")
          print(f"bump={bump}")
          PY
          echo "версия сборки: $(grep '^version=' "$GITHUB_OUTPUT" | tail -n 1)"

      - uses: docker/setup-buildx-action@v4

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.series }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Сборка образа для проверки
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: project-snapshot:test
          # Тег переставляется на новую сборку, поэтому образ несёт коммит, которым собран:
          # по нему манифест прогона связывает слепок с породившей его сборкой.
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Дымовой прогон на самом репозитории
        run: |
          set -euo pipefail
          mkdir -p out
          # Проект монтируется под именем репозитория: агент берёт из него slug, и точка
          # монтирования /project назвала бы каталог слепка «project».
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${PWD}:/harvester:ro" \
            -v "${PWD}/out:/out" \
            -e SCAN_IMAGE=project-snapshot -e SCAN_IMAGE_TAG=test \
            project-snapshot:test --project /harvester --code --code-path agent
          # Прогон складывает результаты в каталог {slug}/{метка времени}-{отпечаток фильтров}.
          run_dir="$(find out -mindepth 2 -maxdepth 2 -type d | head -n 1)"
          test -n "${run_dir}"
          test -f "${run_dir}/manifest.json"
          echo "каталог прогона: ${run_dir}"
          docker run --rm -v "${PWD}/out:/out" --entrypoint python project-snapshot:test \
            -m agent.cli validate "/out/${run_dir#out/}"
          python - "${run_dir}" <<'PY'
          import gzip, json, sys
          from pathlib import Path

          run = Path(sys.argv[1])
          manifest = json.loads((run / "manifest.json").read_text(encoding="utf-8"))

          # Манифест описывает каталог полностью: лишнего в нём нет, недостающего тоже.
          listed = {item["name"] for item in manifest["objects"]}
          actual = {
              path.relative_to(run).as_posix()
              for path in run.rglob("*")
              if path.is_file() and path.name != "manifest.json"
          }
          assert listed == actual, f"манифест расходится с каталогом: {listed ^ actual}"

          # Участники живут в скалярной части, остальное — посекционно.
          core = json.loads(gzip.decompress((run / "core.json.gz").read_bytes()))
          assert core["people"], "участники пусты"

          records = {item["name"]: item.get("records") for item in manifest["objects"]}
          for section in ("commits", "files", "relationships", "evidence", "code_units"):
              name = f"{section}.jsonl.gz"
              assert records.get(name), f"секция {section} пуста"
              with gzip.open(run / name, "rt", encoding="utf-8") as handle:
                  lines = sum(1 for _ in handle)
              assert lines == records[name], (
                  f"{section}: манифест обещает {records[name]} записей, в секции {lines}"
              )

          scope = manifest.get("analysis_scope") or {}
          assert scope, "охват анализа кода не записан"
          print(
              "коммитов:", records["commits.jsonl.gz"],
              "| файлов:", records["files.jsonl.gz"],
              "| определений кода:", records["code_units.jsonl.gz"],
          )
          PY

      - name: Отчёт прогона
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-result
          path: out/
          retention-days: 7

      - name: Отметка версии тегом
        if: github.event_name != 'pull_request' && steps.version.outputs.bump == 'yes'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Образ $TAG"
          git push origin "$TAG"

      - name: Вход в реестр
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикация только для веток и тегов: сборка из forked pull request не имеет прав на реестр.
      - name: Публикация образа
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
