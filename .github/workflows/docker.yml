# Сборка образа слепка проекта: приёмочные проверки, сборка, дымовой прогон и публикация в GHCR.
name: docker

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  acceptance:
    name: приёмочные проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Шаг 1 — ядро, схема и командный интерфейс
        run: python tests/step1_acceptance.py

      - name: Шаг 2 — история изменений и рабочая копия
        run: python tests/step2_acceptance.py

  image:
    name: образ слепка
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      # Запись в contents нужна для отметки версии тегом в репозитории.
      contents: write
      packages: write
    steps:
      # Полная история нужна дымовому прогону: агент собирает коммиты этого же репозитория.
      # Теги нужны вычислению следующей версии.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Версия образа
        id: version
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, subprocess, tomllib

          # Мажор и минор задаёт проект, патч наращивается автоматически от уже выпущенных тегов.
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          major, minor, _ = project.split(".")

          reference = os.environ.get("GITHUB_REF", "")
          if reference.startswith("refs/tags/v"):
              # Версия задана тегом вручную — она и берётся, ничего не наращиваем.
              version = reference[len("refs/tags/v"):]
              bump = "no"
          else:
              tags = subprocess.run(
                  ["git", "tag", "--list", f"v{major}.{minor}.*"],
                  capture_output=True, text=True, check=False,
              ).stdout.split()
              patches = [
                  int(match.group(1))
                  for tag in tags
                  if (match := re.fullmatch(rf"v{major}\.{minor}\.(\d+)", tag))
              ]
              version = f"{major}.{minor}.{max(patches) + 1 if patches else 0}"
              bump = "yes"

          series = ".".join(version.split(".")[:2])
          print(f"version={version}")
          print(f"tag=v{version}")
          print(f"series={series}")
          print(f"bump={bump}")
          PY
          echo "версия сборки: $(grep '^version=' "$GITHUB_OUTPUT" | tail -n 1)"

      - uses: docker/setup-buildx-action@v3

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.series }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Сборка образа для проверки
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: project-snapshot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Дымовой прогон на самом репозитории
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${PWD}:/project:ro" \
            -v "${PWD}/out:/out" \
            project-snapshot:test --code --code-path agent
          test -f out/scan.json
          export_file="$(ls out/Version*_export.json | head -n 1)"
          test -n "${export_file}"
          echo "выгрузка: ${export_file}"
          docker run --rm -v "${PWD}/out:/out" --entrypoint python project-snapshot:test \
            -m agent.cli validate "/out/$(basename "${export_file}")"
          python - "${export_file}" <<'PY'
          import json, sys
          document = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("commits", "people", "files", "relationships", "evidence"):
              assert document[key], f"массив {key} пуст"
          print("коммитов:", len(document["commits"]), "| файлов:", len(document["files"]))
          PY

      - name: Отчёт прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: out/
          retention-days: 7

      - name: Отметка версии тегом
        if: github.event_name != 'pull_request' && steps.version.outputs.bump == 'yes'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Образ $TAG"
          git push origin "$TAG"

      - name: Вход в реестр
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикация только для веток и тегов: сборка из forked pull request не имеет прав на реестр.
      - name: Публикация образа
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
